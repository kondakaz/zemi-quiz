name: 問題の検査
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: PR の変更を確認
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Bash の比較は大文字と小文字を区別する。
          if [[ "$HEAD_REF" == issue-* ]]; then
            echo 'Issue 作業のため問題ファイルの差分検査を省略します'
          else
            git check-ref-format "refs/heads/$GITHUB_BASE_REF"
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            git show "origin/$GITHUB_BASE_REF:scripts/check-pr.sh" > "$RUNNER_TEMP/check-pr.sh"
            bash "$RUNNER_TEMP/check-pr.sh" "origin/$GITHUB_BASE_REF" "$HEAD_SHA"
          fi
      - run: node scripts/build.mjs --check
